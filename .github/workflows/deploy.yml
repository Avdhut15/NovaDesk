name: Deploy to Render

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Trigger Render Deployment
        # Render provides a unique "Deploy Hook" URL in your Web Service settings.
        # Add it to your GitHub Repository Secrets as RENDER_DEPLOY_HOOK
        run: |
          if [ -z "${{ secrets.RENDER_DEPLOY_HOOK }}" ]; then
            echo "RENDER_DEPLOY_HOOK secret is not set, skipping deployment."
            exit 0
          fi
          echo "Triggering Render deployment..."
          curl -X GET "${{ secrets.RENDER_DEPLOY_HOOK }}"
